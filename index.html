let authInitDone = false;
const authReady = new Promise((resolve) => {
  firebase.auth().onAuthStateChanged(async (user) => {
    if (!user) {
      try { await firebase.auth().signInAnonymously(); }
      catch (e) { console.warn('anon auth fail', e.code); resolve(false); }
      return; // จะ fire ใหม่พร้อม user anonymous
    }
    if (!authInitDone) { authInitDone = true; resolve(true); }
    // คืนสถานะล็อกอินครู/แอดมิน/ผอ ที่ค้างไว้ (persistence ของ Firebase)
    if (!user.isAnonymous && !currentUser) {

        const snap = await database.ref('users/' + user.uid).get();

        if (profile) enterApp(profile.username, profile);
      } catch (e) { console.error('restore profile fail', e); }
    }
  });
});

// ===== SHIM: Firebase Realtime Database =====
window.dataSdk = {
  _handler: null,
  _students: [],
  _transactions: [],
  _emit() {
    if (this._handler && this._handler.onDataChanged) {
      this._handler.onDataChanged([...this._students, ...this._transactions]);
    }
  },
  async init(handler) {
    this._handler = handler;
    await authReady;
    database.ref('students').on('value', (snap) => {
      const arr = [];
      snap.forEach((c) => { arr.push({ ...c.val(), __backendId: c.key }); });
      this._students = arr;
      this._emit();
    }, (err) => {
      console.error('อ่านข้อมูล students ไม่ได้:', err.code, err.message);
      showToast('อ่านข้อมูลนักเรียนไม่ได้ ตรวจสอบ Firebase Rules', 'error');
    });
    database.ref('transactions').on('value', (snap) => {
      const arr = [];
      snap.forEach((c) => { arr.push({ ...c.val(), __backendId: c.key }); });
      this._transactions = arr;
      this._emit();
    }, (err) => {
      console.error('อ่านข้อมูล transactions ไม่ได้:', err.code, err.message);
    });
    return { isOk: true };
  },
  async create(record) {
    try {
      const path = record.type === 'transaction' ? 'transactions' : 'students';
      const ref = await database.ref(path).push(record);
      return { isOk: true, id: ref.key };
    } catch (e) {
      console.error('dataSdk.create error:', e);
      return { isOk: false, error: e };
    }
  },
  async remove(backendId, type) {
    try {
      const path = type === 'transaction' ? 'transactions' : 'students';
      await database.ref(path + '/' + backendId).remove();
      return { isOk: true };
    } catch (e) {
      console.error('dataSdk.remove error:', e);
      return { isOk: false, error: e };
    }
  }
};

// ===== SHIM: element_sdk =====
window.elementSdk = {
  config: {},
  _onChange: null,
  init(opts) {
    this.config = { ...(opts.defaultConfig || {}) };
    this._onChange = opts.onConfigChange || null;
    authReady.then(() => {
      database.ref('config').on('value', (snap) => {
        const val = snap.val() || {};
        this.config = { ...(opts.defaultConfig || {}), ...val };
        if (this._onChange) this._onChange(this.config);
      }, (err) => console.error('อ่าน config ไม่ได้:', err.code, err.message));
    });
  },
  setConfig(partial) {
    this.config = { ...this.config, ...partial };
    database.ref('config').update(partial).catch((e) => console.error('setConfig error:', e));
  }
};

// แปลงวันที่เป็นปีการศึกษา พ.ศ. (เมษายนต่อท้ายปีเก่า)
function getAcademicYear(date) {
  const d = new Date(date);
  const month = d.getMonth() + 1;
  const yearAD = d.getFullYear();
  const academicYearAD = (month >= 5) ? yearAD : yearAD - 1;
  return academicYearAD + 543;
}

// หาช่วงวันที่ของปีการศึกษา
function getAcademicYearRange(academicYearBE) {
  const startAD = academicYearBE - 543;
  return { start: `${startAD}-05-01`, end: `${startAD + 1}-04-30` };
}

// ===== ตัวเลือกปีการศึกษา (Academic Year Filter) =====
let selectedAcademicYear = getAcademicYear(new Date());

function getAcademicYearList() {
  const cfg = parseInt((window.elementSdk?.config?.academic_year) || defaultConfig.academic_year, 10);
  const cur = getAcademicYear(new Date());
  return [...new Set([2567, 2568, 2569, cfg, cur])]
    .filter(y => Number.isFinite(y))
    .sort((a, b) => b - a);
}

function academicYearSelectorHTML() {
  const years = getAcademicYearList();
  return `
    <div class="ios-card p-3 no-print flex items-center gap-2 flex-wrap">
      <label class="text-sm font-medium text-gray-700">📅 ปีการศึกษา</label>
      <select class="ios-input text-sm" style="width:auto;" onchange="changeAcademicYear(this.value)">
        ${years.map(y => `<option value="${y}" ${Number(selectedAcademicYear) === y ? 'selected' : ''}>${y}</option>`).join('')}
      </select>
    </div>`;
}

function changeAcademicYear(val) {
  selectedAcademicYear = parseInt(val, 10);
  navigateTo(currentPage);
}

// ยอดสะสมถึงสิ้นปีการศึกษาที่เลือก (รวมยอดยกมาจากปีก่อน)
function balanceOfYear(studentId, yearBE = selectedAcademicYear) {
  return sampleTransactions
    .filter(t => t.studentId === studentId && getAcademicYear(t.date) <= yearBE)
    .reduce((sum, t) => sum + (t.type === 'deposit' ? t.amount : -t.amount), 0);
}

// ===== DATA HANDLER =====

let usersListenerRef = null;

function startUsersListener() {
  if (usersListenerRef) return; // ฟังอยู่แล้ว ไม่ซ้ำ
  usersListenerRef = database.ref('users');
  usersListenerRef.on('value', (snap) => {
    const arr = [];
    snap.forEach((c) => {
      const v = c.val();
      if (v && typeof v === 'object' && v.username) {
        arr.push({ ...v, __backendId: c.key });
      }
    });
    teacherUsers = arr;
    usersLoaded = true;
    if (currentUser && currentPage === 'manage') renderManage();
  }, (err) => {
    const u = firebase.auth().currentUser;
    if (u && u.isAnonymous) return; // ยังไม่ล็อกอิน ไม่ต้องเตือน
    console.error('อ่านข้อมูล users ไม่ได้:', err.code, err.message);
    showToast('อ่านข้อมูลผู้ใช้ไม่ได้ ตรวจสอบ Firebase Rules', 'error');
  });
}

function stopUsersListener() {
  if (usersListenerRef) { usersListenerRef.off(); usersListenerRef = null; }
  teacherUsers = [];
  usersLoaded = false;
}

authReady.then(() => {
  database.ref('classes').on('value', (snap) => {
    const arr = [];
    snap.forEach((c) => { const v = c.val(); if (v && v.name) arr.push({ name: v.name, __backendId: c.key }); });
    customClassObjs = arr;
    customClasses = arr.map(o => o.name);
    if (currentUser && currentPage === 'manage') renderManage();
  }, (err) => {
    console.error('อ่านข้อมูล classes ไม่ได้:', err.code, err.message);
  });
});

function getAllUsers() {
  const merged = { ...defaultUsers };
  teacherUsers.forEach(u => {
    if (!u.username) return;
    merged[u.username] = {
      password: u.password,
      role: u.role || 'teacher',
      name: u.name,
      class: u.class,
      __backendId: u.__backendId
    };
  });
  return merged;
}

function getAllClasses() {
  const fromStudents = sampleStudents.map(s => s.class).filter(Boolean);
  return [...new Set([...fromStudents, ...customClasses])].sort();
}

function showToast(msg, type = 'success') {

async function deleteTransaction(backendId) {
  if (!requireEdit()) return;
  const txn = transactions.find(t => t.__backendId === backendId);
  if (!txn) { showToast('ไม่พบรายการ', 'error'); return; }
  if (!canDeleteTxn(txn)) { showToast('คุณไม่มีสิทธิ์ลบรายการนี้', 'error'); return; }

  const student = sampleStudents.find(s => s.id === txn.studentId);
  const who = student ? student.prefix + student.name : txn.studentId;
  const typeLabel = txn.type === 'deposit' ? 'ฝาก' : 'ถอน';
  const dateLabel = new Date(txn.date).toLocaleDateString('th-TH');

  if (!confirm(`ยืนยันลบรายการ ${typeLabel} ฿${txn.amount} ของ ${who}\nวันที่ ${dateLabel}?\nยอดเงินจะถูกคำนวณใหม่ และลบไม่สามารถย้อนกลับได้`)) return;

  const result = await window.dataSdk.remove(backendId, 'transaction');
  showToast(result.isOk ? 'ลบรายการสำเร็จ' : 'ลบไม่สำเร็จ', result.isOk ? 'success' : 'error');
}

// ===== QR SCANNER =====
let qrScanner = null;

async function startScanner() {
  const readerEl = document.getElementById('qrReader');
  if (!readerEl) return;
  if (qrScanner) { showToast('กล้องเปิดอยู่แล้ว', 'info'); return; }
  if (typeof Html5Qrcode === 'undefined') { showToast('ไลบรารีสแกนยังไม่โหลด', 'error'); return; }

  readerEl.classList.remove('hidden');
  qrScanner = new Html5Qrcode('qrReader');
  const cfg = { fps: 10, qrbox: 220 };

  try {
    await qrScanner.start({ facingMode: { exact: 'environment' } }, cfg, onScanSuccess, () => {});
  } catch (e) {
    try {
      await qrScanner.start({ facingMode: 'environment' }, cfg, onScanSuccess, () => {});
    } catch (e2) {
      qrScanner = null;
      readerEl.classList.add('hidden');
      showToast('เปิดกล้องไม่ได้ ต้องอนุญาตสิทธิ์กล้อง', 'error');
    }
  }
}

async function stopScanner() {
  const readerEl = document.getElementById('qrReader');
  if (qrScanner) {
    try { await qrScanner.stop(); qrScanner.clear(); } catch (e) {}
    qrScanner = null;
  }
  if (readerEl) readerEl.classList.add('hidden');
}

// ===== SCAN FEEDBACK =====
let audioCtx = null;

function scanFeedback(success = true) {
  try {
    if (navigator.vibrate) {
      navigator.vibrate(success ? 120 : [80, 60, 80]);
    }
  } catch (e) {}

  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = 'square';
    osc.frequency.value = success ? 880 : 300;

    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

    osc.start(now);
    osc.stop(now + 0.16);
  } catch (e) {}
}

function onScanSuccess(decodedText) {
  const id = (decodedText || '').trim();
  const student = sampleStudents.find(s => s.id === id);
  stopScanner();
  if (student) {
    if (currentUser.role === 'teacher' && student.class !== currentUser.class) {
      scanFeedback(false);
      showToast('นักเรียนคนนี้ไม่ได้อยู่ห้องของคุณ', 'error');
      return;
    }
    scanFeedback(true);
    selectStudent(id);
    showToast('พบนักเรียน: ' + student.prefix + student.name, 'success');
  } else {
    scanFeedback(false);
    showToast('ไม่พบนักเรียนรหัส ' + id, 'error');
  }
}

function searchStudent(query) {
  const results = document.getElementById('searchResults');
  if (!query || query.length < 1) { results.innerHTML = ''; return; }
  const filtered = sampleStudents.filter(s =>
    s.id.toLowerCase().includes(query.toLowerCase()) ||
    s.name.includes(query) ||
    (s.prefix + s.name).includes(query)
  );

  if (currentUser.role === 'teacher') {
    const classFiltered = filtered.filter(s => s.class === currentUser.class);
    results.innerHTML = classFiltered.map(s => `
      <div class="flex items-center justify-between p-3 rounded-lg hover:bg-ios-lightgray cursor-pointer border-b border-ios-separator" onclick="selectStudent('${s.id}')">
        <div><span class="font-medium">${s.prefix}${s.name}</span> <span class="text-xs text-ios-gray">${s.class}</span></div>
        <span class="text-sm text-ios-blue">${s.id}</span>
      </div>
    `).join('') || '<p class="text-sm text-ios-gray p-2">ไม่พบนักเรียน</p>';
  } else {
    results.innerHTML = filtered.map(s => `
      <div class="flex items-center justify-between p-3 rounded-lg hover:bg-ios-lightgray cursor-pointer border-b border-ios-separator" onclick="selectStudent('${s.id}')">
        <div><span class="font-medium">${s.prefix}${s.name}</span> <span class="text-xs text-ios-gray">${s.class}</span></div>
        <span class="text-sm text-ios-blue">${s.id}</span>
      </div>
    `).join('') || '<p class="text-sm text-ios-gray p-2">ไม่พบนักเรียน</p>';
  }
}

  document.getElementById('txnForm').classList.remove('hidden');

}

function updateTxnTypeUI() {
  const dep = document.getElementById('btnDeposit');
  const wth = document.getElementById('btnWithdraw');
  if (!dep || !wth) return;
  if (txnType === 'deposit') {

function setAmount(amt) {

  document.getElementById('customAmount').value = amt;
  updateAmountBtns();
}

function updateAmountBtns() {
  document.querySelectorAll('.amount-btn').forEach(btn => {
    const val = parseInt(btn.textContent.replace('฿', ''));
    btn.classList.toggle('selected', val === txnAmount);
  });
}

async function saveTransaction() {
  if (!requireEdit()) return;
  if (!txnSelectedStudent || txnAmount <= 0) {
    showToast('กรุณาเลือกนักเรียนและจำนวนเงิน', 'error');
    return;
  }
  if (txnType === 'withdraw' && txnAmount > txnSelectedStudent.balance) {
    showToast('ยอดเงินไม่เพียงพอ', 'error');
    return;
  }

  const btn = document.getElementById('saveTxnBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  const newBalance = txnType === 'deposit' ? txnSelectedStudent.balance + txnAmount : txnSelectedStudent.balance - txnAmount;

  let isoDate;
  const dateInput = document.getElementById('txnDate');
  if (dateInput && dateInput.value) {
    const [y, m, d] = dateInput.value.split('-').map(Number);
    const now = new Date();
    isoDate = new Date(y, m - 1, d, now.getHours(), now.getMinutes(), now.getSeconds()).toISOString();
  } else {
    isoDate = new Date().toISOString();
  }

  const result = await window.dataSdk.create({
    type: 'transaction',
    student_id: txnSelectedStudent.id,
    student_name: txnSelectedStudent.prefix + txnSelectedStudent.name,
    student_prefix: txnSelectedStudent.prefix,
    student_class: txnSelectedStudent.class,
    student_number: txnSelectedStudent.number,
    student_id_card: '',
    transaction_type: txnType,
    amount: txnAmount,
    balance: newBalance,
    date: isoDate,
    recorded_by: currentUser.username,
    note: ''
  });

  btn.disabled = false;
  btn.textContent = 'บันทึกรายการ';

  if (result.isOk) {
    txnSelectedStudent.balance = newBalance;
    showToast(`${txnType === 'deposit' ? 'ฝาก' : 'ถอน'} ฿${txnAmount} สำเร็จ`, 'success');
    txnAmount = 0;
    document.getElementById('customAmount').value = '';
    updateAmountBtns();
    selectStudent(txnSelectedStudent.id);
  } else {
    showToast('เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
  }
}

async function removeStudentById(id) {
  const student = sampleStudents.find(s => s.id === id);
  if (!student || !student.__backendId) return false;
  const result = await window.dataSdk.remove(student.__backendId, 'student');
  return result.isOk;
}

async function deleteOneStudent(id) {
  if (!requireEdit()) return;
  const student = sampleStudents.find(s => s.id === id);
  if (!student) return;
  if (!confirm(`ยืนยันลบ ${student.prefix}${student.name} (${id})?\nการลบไม่สามารถย้อนกลับได้`)) return;
  const ok = await removeStudentById(id);
  showToast(ok ? 'ลบนักเรียนสำเร็จ' : 'ลบไม่สำเร็จ (ข้อมูลตัวอย่างลบไม่ได้)', ok ? 'success' : 'error');
}

async function deleteSelectedStudents() {
  if (!requireEdit()) return;
  const ids = [...document.querySelectorAll('.student-check:checked')].map(cb => cb.value);
  if (ids.length === 0) { showToast('ยังไม่ได้เลือกนักเรียน', 'error'); return; }
  if (!confirm(`ยืนยันลบนักเรียนที่เลือก ${ids.length} คน?\nการลบไม่สามารถย้อนกลับได้`)) return;
  let count = 0;
  for (const id of ids) { if (await removeStudentById(id)) count++; }
  showToast(`ลบสำเร็จ ${count} คน`, 'success');
}

async function deleteClassStudents() {
  if (!requireEdit()) return;
  const cls = document.getElementById('deleteClassSelect').value;
  if (!cls) { showToast('กรุณาเลือกห้องที่จะลบ', 'error'); return; }
  const inClass = sampleStudents.filter(s => s.class === cls);
  if (inClass.length === 0) { showToast('ห้องนี้ไม่มีนักเรียน', 'error'); return; }
  if (!confirm(`ยืนยันลบนักเรียนทั้งห้อง ${cls} จำนวน ${inClass.length} คน?\nการลบไม่สามารถย้อนกลับได้`)) return;
  let count = 0;
  for (const s of inClass) { if (await removeStudentById(s.id)) count++; }
  showToast(`ลบห้อง ${cls} สำเร็จ ${count} คน`, 'success');

// ===== เลื่อนชั้นนักเรียน =====
function suggestNextClass(cls) {
  const m = (cls || '').match(/^(ป|ม)\.(\d+)\/(\d+)$/);
  if (!m) return '';
  const level = m[1], grade = parseInt(m[2], 10), room = m[3];
  if (level === 'ป') return grade < 6 ? `ป.${grade + 1}/${room}` : `ม.1/${room}`;
  if (level === 'ม') return grade < 6 ? `ม.${grade + 1}/${room}` : '';
  return '';
}

function onPromoteSourceChange() {
  const src = document.getElementById('promoteSource').value;
  const target = suggestNextClass(src);
  document.getElementById('promoteTarget').value = target;
  const count = sampleStudents.filter(s => s.class === src).length;
  const preview = document.getElementById('promotePreview');
  if (!src) { preview.innerHTML = ''; return; }
  preview.innerHTML = target
    ? `จะเลื่อน ${count} คน จาก <b>${src}</b> → <b>${target}</b>`
    : `<span class="text-ios-red">${src} เป็นชั้นจบการศึกษา กรุณาระบุห้องปลายทางเอง</span>`;
}

async function confirmPromotion() {
  if (!requireEdit()) return;
  const src = document.getElementById('promoteSource').value;
  const target = document.getElementById('promoteTarget').value.trim();
  if (!src) { showToast('เลือกห้องต้นทาง', 'error'); return; }
  if (!target) { showToast('ระบุห้องปลายทาง', 'error'); return; }

  const list = sampleStudents.filter(s => s.class === src && s.__backendId);
  if (list.length === 0) { showToast('ห้องนี้ไม่มีนักเรียน (หรือเป็นข้อมูลตัวอย่าง)', 'error'); return; }

  if (!confirm(`ยืนยันเลื่อนชั้น ${list.length} คน\nจาก ${src} → ${target}?\nย้อนกลับอัตโนมัติไม่ได้`)) return;

  const btn = document.querySelector('#promoteModal button:last-child');
  btn.disabled = true; btn.textContent = 'กำลังเลื่อนชั้น...';

  let count = 0;
  for (const s of list) {
    const ok = await database.ref('students/' + s.__backendId)
      .update({ student_class: target })
      .then(() => true).catch((e) => { console.error('เลื่อนชั้น error:', e); return false; });
    if (ok) count++;
  }

  const m = document.getElementById('promoteModal'); if (m) m.remove();
  showToast(`เลื่อนชั้น ${src} → ${target} สำเร็จ ${count} คน`, count ? 'success' : 'error');
}

async function saveEditStudent(studentId) {
  if (!requireEdit()) return;
  const student = sampleStudents.find(s => s.id === studentId);
  const newId = document.getElementById('editStudentId').value.trim();
  const newNumber = document.getElementById('editStudentNumber').value.trim();
  const newPrefix = document.getElementById('editStudentPrefix').value;
  const newName = document.getElementById('editStudentName').value.trim();
  const classVal = document.getElementById('editStudentClass').value;
  const newClassName = document.getElementById('editClassName').value.trim();
  const newIdCard = document.getElementById('editStudentIdCard').value.trim();

  const finalClass = classVal === 'new' ? newClassName : classVal;

  if (!newId || !newNumber || !newName || !finalClass) {
    showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
    return;
  }

  if (newId !== studentId && sampleStudents.find(s => s.id === newId)) {
    showToast('รหัสนักเรียนนี้มีอยู่แล้ว', 'error');
    return;
  }

  if (student.__backendId) {
    const result = await database.ref('students/' + student.__backendId).update({
      student_id: newId,
      student_number: newNumber,
      student_prefix: newPrefix,
      student_name: newName,
      student_class: finalClass,
      student_id_card: newIdCard
    }).then(() => ({ isOk: true })).catch(() => ({ isOk: false }));

    if (!result.isOk) { showToast('บันทึกไม่สำเร็จ', 'error'); return; }
    document.getElementById('editStudentModal').remove();
    showToast('บันทึกการเปลี่ยนแปลงสำเร็จ', 'success');
  } else {
    student.id = newId;
    student.number = newNumber;
    student.prefix = newPrefix;
    student.name = newName;
    student.class = finalClass;
    student.idCard = newIdCard;
    document.getElementById('editStudentModal').remove();
    showToast('บันทึก (ข้อมูลตัวอย่าง) สำเร็จ', 'success');
    renderAccounts();
  }
}

function loadStudentCSVFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let text = e.target.result || '';
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length && /รหัสนักเรียน/.test(lines[0])) {
      lines.shift();
    }
    document.getElementById('csvInput').value = lines.join('\n');
    showToast(`โหลดไฟล์แล้ว ${lines.length} แถว ตรวจสอบแล้วกดนำเข้า`, 'info');
  };
  reader.onerror = () => showToast('อ่านไฟล์ไม่สำเร็จ', 'error');
  reader.readAsText(file, 'UTF-8');
}

async function importCSV() {
  if (!requireEdit()) return;
  const csv = document.getElementById('csvInput').value.trim();
  if (!csv) { showToast('กรุณากรอกข้อมูล', 'error'); return; }

  const btn = document.querySelector('#csvModal button:last-child');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'กำลังนำเข้า...';

  const lines = csv.split('\n');
  let count = 0;

  for (const line of lines) {
    const parts = line.split(',').map(s => s.trim());
    if (parts.length >= 5) {
      const result = await window.dataSdk.create({
        type: 'student',
        student_id: parts[0],
        student_number: parts[1],
        student_prefix: parts[2],
        student_name: parts[3],
        student_class: parts[4],
        student_id_card: parts[5] || '',
        balance: 0,
        transaction_type: '',
        amount: 0,
        date: new Date().toISOString(),
        recorded_by: currentUser.username,
        note: ''
      });
      if (result.isOk) count++;
    }
  }

  btn.disabled = false;
  btn.textContent = originalText;

  document.getElementById('csvModal').remove();
  showToast(`นำเข้า ${count} รายการสำเร็จ`, 'success');
}

function downloadCSVTemplate() {
  const template = `รหัสนักเรียน,เลขที่,คำนำหน้า,ชื่อ-สกุล,ชั้น,เลขบัตรประชาชน

STD007,7,ด.ญ.,นิษฐา มีสุข,ป.3/1,1100100100007

STD010,10,ด.ช.,สิรพัฒน์ เรียนดี,ป.4/1,1100100100010`;

  const blob = new Blob(['\ufeff' + template], { type: 'text/csv;charset=utf-8;' });

function loadTeacherCSVFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let text = e.target.result || '';
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length && /username/i.test(lines[0]) && /[,]/.test(lines[0])) {
      lines.shift();
    }
    document.getElementById('teacherCsvInput').value = lines.join('\n');
    showToast(`โหลดไฟล์แล้ว ${lines.length} แถว ตรวจสอบแล้วกดนำเข้า`, 'info');
  };
  reader.onerror = () => showToast('อ่านไฟล์ไม่สำเร็จ', 'error');
  reader.readAsText(file, 'UTF-8');
}

async function importTeacherCSV() {
  if (!requireEdit()) return;
  const csv = document.getElementById('teacherCsvInput').value.trim();
  if (!csv) { showToast('กรุณากรอกข้อมูล', 'error'); return; }

  const btn = document.querySelector('#teacherCsvModal button:last-child');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'กำลังนำเข้า...';

  const lines = csv.split('\n');
  let count = 0, skipped = 0, failed = 0;

  for (const line of lines) {
    if (!line.trim()) continue;
    const parts = line.split(',').map(s => s.trim());
    if (parts.length < 4) { skipped++; continue; }
    const [username, password, name, cls] = parts;
    if (!username || !password || !name || !cls) { skipped++; continue; }
    if (password.length < 6) { console.warn('รหัสสั้นเกินไป ข้าม:', username); failed++; continue; }

    try {
      const email = username.toLowerCase() + EMAIL_DOMAIN;
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      await database.ref('users/' + uid).set({ username, name, class: cls, role: 'teacher' });
      count++;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') { skipped++; }
      else { console.error('import teacher fail', username, e.code); failed++; }
    }
  }
  try { await secondaryApp.auth().signOut(); } catch (e) {}

  btn.disabled = false;
  btn.textContent = originalText;
  document.getElementById('teacherCsvModal').remove();
  showToast(`นำเข้าครู ${count} คน • ข้าม ${skipped} • รหัสไม่ผ่าน ${failed}`, count ? 'success' : 'error');
}
   
function downloadTeacherCSVTemplate() {
  const template = `Username,รหัสผ่าน,ชื่อ-สกุล,ชั้น
teacher3,123456,ครูสมศรี ใจงาม,ป.3/1
teacher4,123456,ครูมานพ ตั้งใจ,ป.4/1
teacher5,123456,ครูวิภา สอนดี,ป.5/1`;

  const blob = new Blob(['\ufeff' + template], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', 'template_teachers.csv');
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('ดาวน์โหลดเทมเพลตครู CSV สำเร็จ', 'success');
}

async function migrateTeachersToAuth() {
  if (currentUser.role !== 'admin') { showToast('เฉพาะแอดมิน', 'error'); return; }
  if (!confirm('ย้ายครูเดิมทั้งหมดเข้าระบบ Auth?\nทำครั้งเดียวพอ (กดซ้ำได้ ระบบจะข้ามคนที่ย้ายแล้ว)')) return;

  const snap = await database.ref('users').get();
  const all = snap.val() || {};
  let ok = 0, skip = 0, fail = 0;

  for (const key of Object.keys(all)) {
    const u = all[key];
    if (!u || !u.username || !u.password) { skip++; continue; } // ไม่มีรหัส = ย้ายแล้ว
    const email = u.username.toLowerCase() + EMAIL_DOMAIN;
    try {
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, u.password);
      const uid = cred.user.uid;
      await database.ref('users/' + uid).set({
        username: u.username, name: u.name || '', class: u.class || '', role: u.role || 'teacher'
      });
      if (key !== uid) await database.ref('users/' + key).remove();
      ok++;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        await database.ref('users/' + key + '/password').remove().catch(() => {});
        skip++;
      } else { console.error('migrate fail', u.username, e.code); fail++; }
    }
  }
  try { await secondaryApp.auth().signOut(); } catch (e) {}
  showToast(`ย้ายสำเร็จ ${ok} คน • ข้าม ${skip} • ล้มเหลว ${fail}`, ok || skip ? 'success' : 'error');
}

          <div class="flex items-center justify-center" style="width:64px;flex-shrink:0;">
            <div id="qr-${s.id}" style="width:58px;height:58px;background:#fff;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;"></div>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  renderCardQRCodes(filtered, 0);
}

function renderCardQRCodes(list, attempt) {
  if (typeof QRCode === 'undefined') {
    if (attempt < 40) {
      setTimeout(() => renderCardQRCodes(list, attempt + 1), 100);
      return;
    }
    list.forEach(s => {
      const el = document.getElementById('qr-' + s.id);
      if (el) el.innerHTML = '<span style="font-size:8px;color:#999;">โหลด QR ไม่ได้</span>';
    });
    return;
  }

  list.forEach(s => {
    const el = document.getElementById('qr-' + s.id);
    if (!el) return;
    el.innerHTML = '';
    try {
      if (typeof QRCode.toCanvas === 'function') {
        const canvas = document.createElement('canvas');
        el.appendChild(canvas);
        QRCode.toCanvas(canvas, s.id, { width: 60, margin: 0 }, (err) => {
          if (err) el.innerHTML = '<span style="font-size:8px;color:#999;">QR error</span>';
        });
      } else {
        const opts = { text: s.id, width: 60, height: 60 };
        if (QRCode.CorrectLevel) opts.correctLevel = QRCode.CorrectLevel.M;
        new QRCode(el, opts);
      }
    } catch (e) {
      el.innerHTML = '<span style="font-size:8px;color:#999;">QR error</span>';
    }
  });
}

// ===== PASSBOOK (สมุดบัญชี) =====
let pbCurrentStudentId = null;
let pbClassMode = false;
function renderPassbook() {
  const content = document.getElementById('mainContent');
  const relevant = currentUser.role === 'admin'
    ? sampleStudents
    : sampleStudents.filter(s => s.class === currentUser.class);
  const classes = currentUser.role === 'admin' ? getAllClasses() : [...new Set(relevant.map(s => s.class))].sort();

  content.innerHTML = `
    <div class="fade-in max-w-3xl mx-auto space-y-4">
      ${academicYearSelectorHTML()}
      <div class="ios-card p-4 no-print">
        <h2 class="font-semibold text-lg mb-3">📒 พิมพ์สมุดบัญชีนักเรียน</h2>
        <div class="flex flex-wrap gap-2 items-center">
          ${currentUser.role === 'admin' ? `
            <select id="pbClassSelect" class="ios-input w-auto" onchange="onPassbookClassChange()">
              <option value="">-- เลือกชั้น --</option>
              ${classes.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
          ` : ''}
          <select id="pbStudentSelect" class="ios-input w-auto" onchange="generatePassbook(this.value)">
            <option value="">-- เลือกนักเรียน --</option>
            ${currentUser.role === 'teacher' ? relevant.map(s => `<option value="${s.id}">${s.prefix}${s.name} (${s.id})</option>`).join('') : ''}
          </select>
          <button onclick="generateClassPassbooks()" class="ios-btn px-4 py-2 bg-ios-purple text-white text-sm">📚 พิมพ์ทั้งห้อง</button>
          <button onclick="window.print()" class="ios-btn px-4 py-2 bg-ios-green text-white text-sm">พิมพ์ / Export PDF</button>
        </div>
      </div>
      <div id="passbookContainer"></div>
    </div>
  `;

  if (pbCurrentStudentId) generatePassbook(pbCurrentStudentId);
}

function onPassbookClassChange() {
  const cls = document.getElementById('pbClassSelect').value;
  const studentSelect = document.getElementById('pbStudentSelect');
  const inClass = sampleStudents.filter(s => s.class === cls);
  studentSelect.innerHTML = '<option value="">-- เลือกนักเรียน --</option>' +
    inClass.map(s => `<option value="${s.id}">${s.prefix}${s.name} (${s.id})</option>`).join('');
  pbCurrentStudentId = null;
  document.getElementById('passbookContainer').innerHTML = '';
}

function buildPassbookHTML(student) {
  const yearTxns = sampleTransactions
    .filter(t => t.studentId === student.id && getAcademicYear(t.date) === selectedAcademicYear)
    .slice()
    .sort((a, b) => new Date(a.date) - new Date(b.date));

  const broughtForward = balanceOfYear(student.id, selectedAcademicYear - 1);

  let running = broughtForward;
  const rows = yearTxns.map(t => {
    running += (t.type === 'deposit' ? t.amount : -t.amount);
    return { ...t, running };
  });

  const totalDeposit = yearTxns.filter(t => t.type === 'deposit').reduce((sum, t) => sum + t.amount, 0);
  const totalWithdraw = yearTxns.filter(t => t.type === 'withdraw').reduce((sum, t) => sum + t.amount, 0);
  const finalBalance = running;

  const config = window.elementSdk.config;
  const schoolName = config.school_name || defaultConfig.school_name;

  return `
    <div class="ios-card p-6" style="background:#fff;">
      <div class="flex items-center gap-3 border-b-2 border-ios-blue pb-3 mb-4">
        <img src="logo bookbank.png" alt="โลโก้" class="w-12 h-12 rounded-full object-cover" onerror="this.style.background='#007AFF';">
        <div class="flex-1">
          <h2 class="font-bold text-lg">${schoolName}</h2>
          <p class="text-sm text-ios-gray">สมุดบัญชีเงินฝากนักเรียน • ปีการศึกษา ${selectedAcademicYear}</p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 text-sm mb-4">
        <p><span class="font-semibold">ชื่อ-สกุล:</span> ${student.prefix}${student.name}</p>
        <p><span class="font-semibold">รหัสนักเรียน:</span> ${student.id}</p>
        <p><span class="font-semibold">ชั้น:</span> ${student.class}</p>
        <p><span class="font-semibold">เลขที่:</span> ${student.number}</p>
      </div>

      <table class="w-full text-sm border border-ios-separator" style="border-collapse:collapse;">
        <thead>
          <tr class="bg-ios-lightgray">
            <th class="p-2 border border-ios-separator text-center">ครั้งที่</th>
            <th class="p-2 border border-ios-separator text-left">วันที่</th>
            <th class="p-2 border border-ios-separator text-right">ฝาก</th>
            <th class="p-2 border border-ios-separator text-right">ถอน</th>
            <th class="p-2 border border-ios-separator text-right">คงเหลือ</th>
          </tr>
        </thead>
        <tbody>
          ${broughtForward !== 0 ? `
          <tr class="bg-blue-50">
            <td class="p-2 border border-ios-separator text-center">-</td>
            <td class="p-2 border border-ios-separator font-medium">ยอดยกมา (ก่อนปี ${selectedAcademicYear})</td>
            <td class="p-2 border border-ios-separator text-right">-</td>
            <td class="p-2 border border-ios-separator text-right">-</td>
            <td class="p-2 border border-ios-separator text-right font-semibold">${broughtForward.toLocaleString()}</td>
          </tr>
          ` : ''}
          ${rows.length === 0 ? `
            <tr><td colspan="5" class="p-4 text-center text-ios-gray border border-ios-separator">ยังไม่มีรายการในปีการศึกษานี้</td></tr>
          ` : rows.map((t, i) => `
            <tr>
              <td class="p-2 border border-ios-separator text-center">${i + 1}</td>
              <td class="p-2 border border-ios-separator">${new Date(t.date).toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' })}</td>
              <td class="p-2 border border-ios-separator text-right text-ios-green">${t.type === 'deposit' ? t.amount.toLocaleString() : '-'}</td>
              <td class="p-2 border border-ios-separator text-right text-ios-red">${t.type === 'withdraw' ? t.amount.toLocaleString() : '-'}</td>
              <td class="p-2 border border-ios-separator text-right font-semibold">${t.running.toLocaleString()}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr class="bg-ios-lightgray font-semibold">
            <td class="p-2 border border-ios-separator text-center" colspan="2">รวม (เฉพาะปีนี้)</td>
            <td class="p-2 border border-ios-separator text-right text-ios-green">${totalDeposit.toLocaleString()}</td>
            <td class="p-2 border border-ios-separator text-right text-ios-red">${totalWithdraw.toLocaleString()}</td>
            <td class="p-2 border border-ios-separator text-right text-ios-blue">${finalBalance.toLocaleString()}</td>
          </tr>
        </tfoot>
      </table>

      <div class="flex justify-between items-end mt-8 text-sm">
        <p class="text-ios-gray">พิมพ์เมื่อ ${new Date().toLocaleDateString('th-TH')}</p>
        <div class="text-center">
          <div style="height:40px;"></div>
          <p class="border-t border-gray-400 pt-1 px-6">ลายเซ็นผู้รับรอง</p>
        </div>
      </div>
    </div>
  `;
}

function generatePassbook(studentId) {
  const container = document.getElementById('passbookContainer');
  if (!container) return;

  pbCurrentStudentId = studentId || null;
  pbClassMode = false;
  if (!studentId) { container.innerHTML = ''; return; }

  const student = sampleStudents.find(s => s.id === studentId);
  if (!student) { container.innerHTML = ''; return; }

  container.innerHTML = buildPassbookHTML(student);
}

function generateClassPassbooks() {
  const container = document.getElementById('passbookContainer');
  if (!container) return;

  let cls;
  if (currentUser.role === 'admin') {
    const sel = document.getElementById('pbClassSelect');
    cls = sel ? sel.value : '';
  } else {
    cls = currentUser.class;
  }

  if (!cls) { showToast('กรุณาเลือกชั้นก่อน', 'error'); return; }

  const list = sampleStudents
    .filter(s => s.class === cls)
    .sort((a, b) => (parseInt(a.number) || 0) - (parseInt(b.number) || 0));

  if (list.length === 0) { showToast('ห้องนี้ไม่มีนักเรียน', 'error'); return; }

  pbCurrentStudentId = null;
  pbClassMode = true;

  container.innerHTML = list.map((s, i) => `
    <div style="${i < list.length - 1 ? 'page-break-after:always;' : ''}" class="mb-4">
      ${buildPassbookHTML(s)}
    </div>
  `).join('');

  showToast(`เตรียมสมุดบัญชีห้อง ${cls} จำนวน ${list.length} คน กด "พิมพ์" ได้เลย`, 'success');
}
